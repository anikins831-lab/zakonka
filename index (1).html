at":"koap","num":"8.7","title":"Неповиновение законному требованию сотрудника правоохранительных органов","kw":"неповиновение не подчинился ослушался требование сотрудника полиции не выполнил","pun":"Штраф 15 000 – 30 000 ₽ или арест до 14 суток","text":"","upd":1792608272195},{"id":"koap23","cat":"koap","num":"8.8","title":"Клевета","kw":"клевета оклеветал ложь слухи","pun":"Штраф 10 000 – 20 000 ₽","text":"","upd":1792608272195},{"id":"koap24","cat":"koap","num":"8.9","title":"Невыполнение требований прокурора/следователя","kw":"не выполнил требование прокурор следователь","pun":"Штраф 10 000 – 20 000 ₽ (для госслужащих — 10 окладов)","text":"","upd":1792608272195},{"id":"koap25","cat":"koap","num":"8.10","title":"Нарушение законодательства об исполнительном производстве","kw":"исполнительное производство приставы долг","pun":"Штраф 10 000 – 20 000 ₽ (для госслужащих — 10 окладов)","text":"","upd":1792608272195},{"id":"koap26","cat":"koap","num":"8.11","title":"Нарушение правил поведения на охраняемых территориях","kw":"охраняемая территория правила поведения","pun":"Штраф 10 000 – 20 000 ₽","text":"","upd":1792608272195},{"id":"koap27","cat":"koap","num":"8.12","title":"Ношение маски, скрывающей лицо (кроме разрешённых случаев)","kw":"маска балаклава скрывал лицо","pun":"Штраф 10 000 – 15 000 ₽","text":"","upd":1792608272195},{"id":"koap28","cat":"koap","num":"8.13","title":"Открытое ношение холодного оружия","kw":"нож холодное оружие мачете бита открыто","pun":"Штраф 15 000 – 20 000 ₽","text":"","upd":1792608272195},{"id":"koap29","cat":"koap","num":"8.14","title":"Курение в общественном месте","kw":"курил сигарета курение вейп","pun":"Штраф 5 000 – 10 000 ₽","text":"","upd":1792608272195},{"id":"koap30","cat":"koap","num":"8.15","title":"Нарушение режима ЧП/военного положения/комендантского часа","kw":"чп военное положение комендантский час","pun":"Штраф 10 000 – 30 000 ₽ или арест до 7 суток","text":"","upd":1792608272195},{"id":"pk0","cat":"pk","num":"ст. 6–7","title":"Основания для задержания","kw":"задержание основания задержать застигнут очевидцы розыск ориентировка видео","text":"Задержание — до 60 минут, не наказание; нужна доказательная база. Основания: застигнут при деянии; 3+ очевидца; явные следы; видео от очевидца (эти четыре — только если санкция предусматривает админарест или лишение свободы); скрывает личность и нет документа; неуплата штрафа по ст. 67 УК через 35 секунд после протокола; розыск; ориентировка по рации.","upd":1792608272195},{"id":"pk1","cat":"pk","num":"ст. 7.2","title":"Задержание для установления личности","kw":"личность документ маска паспорт","text":"Составить админпротокол; если нет подозрения в преступлении с лишением свободы — отпустить.","upd":1792608272195},{"id":"pk2","cat":"pk","num":"ст. 6.3–6.4","title":"Предварительное задержание госслужащим (не правоохранителем)","kw":"предварительное задержание госслужащий","text":"До 15 минут, затем передача правоохранительному органу.","upd":1792608272195},{"id":"pk3","cat":"pk","num":"ст. 8","title":"Права задержанного","kw":"права задержанного адвокат звонок молчать конституция","text":"Не свидетельствовать против себя; гос. адвокат (если на месте); адвокат в СИЗО/КПЗ; конфиденциальная беседа до 5 мин; один звонок до 2 мин. Сотрудник обязан предложить адвоката и огласить права по требованию.","upd":1792608272195},{"id":"pk4","cat":"pk","num":"ст. 9","title":"Как реализуются права","kw":"адвокат вызов рация звонок наручники беседа","text":"Адвокат: сообщить в общую рацию, действия приостановить; нет ответа 5 мин — продолжить; адвокат добирается 5 мин. Звонок: отстегнуть одно кольцо наручников, время идёт с этого момента. Беседа: отвести в помещение и выйти, время с выхода. Отказ вслух — повторно не предлагается.","upd":1792608272195},{"id":"pk5","cat":"pk","num":"ст. 10.1","title":"Порядок задержания","kw":"порядок задержания спецсредства представиться статьи обыск доставить","text":"1) спецсредства (ЭШУ при необходимости, наручники, дубинка); 2) представиться (удостоверение, должность, звание, фамилия; засекреченные — жетон, номер, позывной); 3) огласить статьи; 4) личный обыск; 5) доставить. Далее арест при вине, иначе отпустить.","upd":1792608272195},{"id":"pk6","cat":"pk","num":"ст. 10.3, 12","title":"Задержание госслужащих и адвокатов","kw":"госслужащий адвокат сотрудник полиции ск прокуратура фсб задержание","text":"Правоохранитель вызывает СК, прокуратуру или руководство: ответ 5 мин, приезд 10 мин; не приехали — продолжить и передать дело в СК. Задерживают СК, ФСБ, прокуратура или правоохранители по решению прокурора — по перечню статей из ст. 12.2. Правоохранитель сам задерживает того, кто открыл огонь без причины или совершил ст. 37, 55, 78.","upd":1792608272195},{"id":"pk7","cat":"pk","num":"ст. 10.4, 15","title":"Видеозапись","kw":"видео запись камера доказательства 72 часа","text":"Хранить видео задержания 72 часа. Адвокату и руководству — по запросу в течение 24 ч; СК и прокуратуре — в течение 72 ч.","upd":1792608272195},{"id":"pk8","cat":"pk","num":"ст. 11","title":"Кто допускается на место задержания","kw":"посторонние допуск 10 шагов адвокат ск прокуратура фсб","text":"Посторонних можно отогнать на 10 шагов. Допускаются: сотрудники, задержанный, один адвокат, по одному от СК, прокуратуры и ФСБ (в форме), руководство организации задержанного (если он госслужащий).","upd":1792608272195},{"id":"pk9","cat":"pk","num":"ст. 13.2–13.4","title":"Арест без суда и передача ФСБ","kw":"арест без суда решение фсб передача штраф вместо ареста","text":"Любой правоохранитель задерживает и арестовывает без суда по ст. 37–49, 54, 56–68, 70, 86, 87, 89, 90–98 УК; штраф вместо лишения свободы — если статья его предусматривает. По ст. 53, 55, 72–75, 78 — передача ФСБ: ответ 5 мин, прибытие 5 мин.","upd":1792608272195},{"id":"pk10","cat":"pk","num":"ст. 14","title":"Когда задержание заканчивается","kw":"освобождение отпустить окончание срок","text":"Мало доказательств; нет лишения свободы в санкции; истёк срок; нет оснований; привод на допрос. Время стоит на допросе и ожидании адвоката или руководства.","upd":1792608272195},{"id":"pk11","cat":"pk","num":"ст. 17","title":"Неприкосновенность","kw":"неприкосновенность правовая защита губернатор депутат судья","text":"Не задерживать и не обыскивать. Исключение — признаки ст. 37, 38, 70, 71, 73, 89, 90 УК. В остальных случаях зафиксировать на камеру и подать рапорт прокурору субъекта или руководителю СК.","upd":1792608272195},{"id":"pk12","cat":"pk","num":"ст. 18","title":"Арест","kw":"арест порядок личное дело","text":"Объявить причину: назвать статьи и кратко описать; личный обыск; арест на срок из кодекса, заполнить личное дело (статьи и кодекс).","upd":1792608272195},{"id":"pk13","cat":"pk","num":"ст. 19","title":"Личный обыск","kw":"обыск личный изъять конфискация оружие наркотики зиплок","text":"Без постановления — при задержании и аресте. Изымаются оружие (кроме лицензионного), запрещённая защита, наркотики и компоненты. Упаковка — в зиплок.","upd":1792608272195},{"id":"pk14","cat":"pk","num":"ст. 20","title":"Обыск жилища и транспорта","kw":"обыск жилища транспорта ордер дом машина","text":"Нужен ордер следователя или суда. Транспорт без ордера: ЧП, военное положение, КТО; нарушение ПДД; зона преступления; операция ГИБДД с подписями; ОРМ ФСБ; въезд на охраняемую территорию.","upd":1792608272195},{"id":"pk15","cat":"pk","num":"ст. 21","title":"Законное требование","kw":"законное требование представиться форма удостоверение","text":"В форме со знаками различия — назвать государственный орган. Без формы — должность, фамилия, звание, удостоверение.","upd":1792608272195},{"id":"pk16","cat":"pk","num":"ст. 24–25","title":"Применение силы и оружия","kw":"оружие огонь стрельба предупреждение тайзер электрошокер применение силы","text":"Огнестрел против невооружённого — после двух предупреждений. Против вооружённого — предупредить и выстрелить в воздух. Явная угроза жизни — без предупреждения. После выстрела вызвать скорую или помочь. ЭШУ — после одного предупреждения (без него при явной необходимости).","upd":1792608272195},{"id":"pk17","cat":"pk","num":"ст. 56–57","title":"Остановка транспорта","kw":"остановка машины мегафон маячки погоня преследование","text":"Причины: нарушение закона или ПДД, проверка документов. Включить маячки, дать требования в мегафон; после трёх проигнорированных — любые разрешённые средства, включая оружие; в крайнем случае огонь на поражение.","upd":1792608272195},{"id":"pk18","cat":"pk","num":"ст. 58–60","title":"ГИБДД: действия, предписание, эвакуация","kw":"гибдд дпс предписание эвакуатор документы водитель вышел","text":"Представиться, потребовать выйти, показать удостоверение, назвать причину, проверить документы и владение. Предписание: протокол и бланк, 24 часа на исполнение, игнор — уголовная ответственность. Эвакуация: нарушения гл. X ПДД или нет документов; спецтранспорт с включёнными маячками не задерживать.","upd":1792608272195},{"id":"pk19","cat":"pk","num":"ст. 61–62","title":"Кто рассматривает админдела, протокол","kw":"админ протокол коап рассмотрение суд прокуратура","text":"Гл. IX КоАП — ГИБДД/ЦОДД или суд; 5.1, 6.2, 6.4, 6.5 — прокуратура, СК или суд; 7.4, 7.5 — полиция по надзору за рыболовством; остальное — любой правоохранитель. Протокол: бланк со статьями, подпись, копия по запросу.","upd":1792608272195},{"id":"pk20","cat":"pk","num":"ст. 64","title":"Алкотестер","kw":"алкотестер алкоголь пьяный","text":"Только правоохранители и медики, для медосмотра или при задержании; прибор — гос. собственность.","upd":1792608272195},{"id":"pk21","cat":"pk","num":"ст. 4","title":"Принципы","kw":"презумпция невиновности сомнения доказательства недопустимые","text":"Невиновен, пока не доказано; сомнения — в пользу обвиняемого; доказательства с нарушением закона недопустимы. Отказ от штрафа не отдельное деяние, если есть иные меры наказания.","upd":1792608272195},{"id":"upk22","cat":"upk","num":"ст. 39","title":"Допрос","kw":"допрос видео 60 минут задержание","text":"До 60 минут, видео с камеры обязательно (без него допрос незаконен). Допрос с задержанием — до 25 минут по постановлению. Госслужащих допрашивают только СК или ФСБ.","upd":1792608272195},{"id":"upk23","cat":"upk","num":"ст. 39-1","title":"Привод","kw":"привод повестка явка постановление","text":"За неявку без причины. Порядок: объявить постановление, спецсредства, представиться, личный обыск, доставить следователю.","upd":1792608272195},{"id":"upk24","cat":"upk","num":"ст. 38","title":"Обыск по делу","kw":"обыск постановление выемка","text":"По постановлению следователя; предъявить его, предложить выдать добровольно; защитник вправе присутствовать; предметы упаковать и опечатать.","upd":1792608272195},{"id":"upk25","cat":"upk","num":"ст. 23.4, 25.4","title":"Заявление о преступлении, возбуждение дела","kw":"заявление возбуждение дела видео прокурор","text":"К заявлению обязательно видео, иначе не повод для дела. Копию постановления о возбуждении — прокурору в течение 24 часов.","upd":1792608272195},{"id":"upk26","cat":"upk","num":"ст. 27","title":"Подследственность","kw":"подследственность ск фсб кто расследует","text":"ФСБ — ст. 53–59, 64, 69, 71–75 (по лицам вне ч. 2). СК — остальные статьи перечня и дела о депутатах, судьях, прокурорах, следователях, сотрудниках силовых структур. Споры решает прокурор.","upd":1792608272195},{"id":"upk27","cat":"upk","num":"ст. 34, 42","title":"Давность и решение прокурора","kw":"давность продление прокурор 24 часа","text":"Давность продлевает руководитель СК на 7 дней (утвердить у прокурора за 72 ч). Прокурор решает по делу в течение 24 ч (до 72 при сложности).","upd":1792608272195},{"id":"upk28","cat":"upk","num":"ст. 12.4","title":"Права подозреваемого и обвиняемого","kw":"права подозреваемого обвиняемого адвокат дело","text":"Знать обвинение; ознакомиться с делом за 2+ часа до суда; не давать показания; свои доказательства и ходатайства; адвокат по договору; обжаловать приговор.","upd":1792608272195},{"id":"upk29","cat":"upk","num":"ст. 63–65","title":"Оперативно-розыскная деятельность","kw":"орд орм оперативные фсб ск наблюдение поручение","text":"Вправе: СК, ФСБ, ФСИН (в своих пределах), уголовный розыск, собственная безопасность ОВД. Основание — письменное поручение или постановление; акт публикуется в течение 24 ч после мероприятия.","upd":1792608272195},{"id":"upk30","cat":"upk","num":"ст. 60","title":"Обжалование","kw":"жалоба обжаловать суд","text":"Решения правоохранителей о привлечении к ответственности — в городской суд. Письменные решения следователя и прокурора — в Судебную коллегию Верховного суда.","upd":1792608272195},{"id":"fz31","cat":"fz","num":"ст. 6","title":"Обязанности при обращении","kw":"полиция представиться удостоверение жетон пытки насилие","text":"Назвать должность, звание, фамилию, предъявить удостоверение по просьбе; засекреченные — жетон, номер и позывной. Пытки и унижающее обращение запрещены.","upd":1792608272195},{"id":"fz32","cat":"fz","num":"ст. 10","title":"Обязанности полиции","kw":"обязанности полиции заявление помощь прибыть изъять поддельные","text":"Принимать и регистрировать заявления; прибывать на место незамедлительно; оказывать первую помощь; изымать поддельные документы и ограниченно оборотные вещи.","upd":1792608272195},{"id":"fz33","cat":"fz","num":"ст. 11","title":"Права полиции","kw":"права полиции требовать документы доставить патруль перекрыть блокпост разойтись","text":"Требовать прекратить противоправное и назвать имя; проверять документы; вызывать в отдел; осматривать место происшествия; патрулировать, ставить посты, перекрывать проезды; требовать разойтись при нарушении порядка митинга; составлять протоколы; доставлять в отдел; останавливать ТС и требовать выйти; осматривать ТС при подозрении; обыскивать рыбаков и требовать лицензию.","upd":1792608272195},{"id":"term0","cat":"term","num":"","title":"DM (DeathMatch)","kw":"дм дэм дезматч дэсматч дэтматч","text":"Убийство или нанесение урона без IC-причины.","upd":1792608272195},{"id":"term1","cat":"term","num":"","title":"DB (DriveBy)","kw":"дб драйвбай драйв бай","text":"Стрельба из транспорта или давка людей транспортом без IC-причины.","upd":1792608272195},{"id":"term2","cat":"term","num":"","title":"RK (Revenge Kill)","kw":"рк ревендж килл месть","text":"Месть тому, кто убил вашего персонажа, после возрождения. Нельзя.","upd":1792608272195},{"id":"term3","cat":"term","num":"","title":"TK (Team Kill)","kw":"тк тимкилл тим килл","text":"Убийство союзников, членов своей организации.","upd":1792608272195},{"id":"term4","cat":"term","num":"","title":"PG (PowerGaming)","kw":"пг пауергейминг пауэргейминг повер гейминг","text":"Действия, невозможные для реального человека, или принуждение другого игрока к отыгровке без выбора.","upd":1792608272195},{"id":"term5","cat":"term","num":"","title":"MG (MetaGaming)","kw":"мг метагейминг мета гейминг","text":"Использование OOC-информации в игре (из Discord, стрима, чата).","upd":1792608272195},{"id":"term6","cat":"term","num":"","title":"NRP","kw":"нрп нереалистичное","text":"Нереалистичное поведение, не соответствующее ролевой игре.","upd":1792608272195},{"id":"term7","cat":"term","num":"","title":"IC / OOC","kw":"ic ooc ик оос иси аос","text":"IC — всё, что происходит внутри игры (персонаж). OOC — вне игры (вы как игрок).","upd":1792608272195},{"id":"term8","cat":"term","num":"","title":"Fear RP","kw":"фир рп фиар страх","text":"Отыгрыш страха за жизнь персонажа при угрозе оружием.","upd":1792608272195},{"id":"term9","cat":"term","num":"","title":"Отыгровка (/me, /do)","kw":"me do ми ду rp рп roleplay","text":"Описание действий и обстановки персонажа текстом в чате.","upd":1792608272195},{"id":"term10","cat":"term","num":"","title":"Задержание","kw":"detention","text":"Временное ограничение свободы сотрудником. Процедура — по Процессуальному кодексу.","upd":1792608272195},{"id":"term11","cat":"term","num":"","title":"Арест","kw":"arrest","text":"Лишение свободы на определённый срок; назначается по УК.","upd":1792608272195},{"id":"term12","cat":"term","num":"","title":"СПРП ★","kw":"","text":"Показатель из текста УК РФ на форуме RMRP. Расшифровку смотрите в самом законе.","upd":1792608272195},{"id":"term13","cat":"term","num":"","title":"Рецидив","kw":"recidivism","text":"Новое умышленное преступление при наличии судимости; наказание может быть до 3/2 от нормы.","upd":1792608272195},{"id":"term14","cat":"term","num":"","title":"Давность","kw":"statute limitation","text":"Освобождение от ответственности по истечении срока: небольшая тяжесть 6 дн., средняя 12, тяжкая 18, особо тяжкая 24.","upd":1792608272195}],"settings":{"title":"Законка RMRP","sub":"УК · КоАП · УПК · ПК · ФЗ","sources":"Источники: УК — «Общее законодательство» на forum.rmrp.ru; КоАП — памятка RMRP Тверской (по фото); процедуры — краткий пересказ Процессуального кодекса, УПК и ФЗ «О полиции» с форума. Штраф и срок указаны как в кодексе; «СПРП ★» — как в тексте закона. Перед наказанием сверяйтесь с форумом: законы обновляются.","notice":"","accent":"gold","showAdminBtn":true},"users":[{"login":"admin","name":"Главный админ","role":"admin","perms":{"add":true,"edit":true,"del":true,"bulk":true,"data":true,"settings":true,"users":true},"cats":[],"active":true,"salt":"zq190k7baqfwlt5q","hash":"dee3b45da758efb2aa6b13fd63793b9ff976d35230d9d4d2731610b40f32dbbc","upd":1792611219860},{"login":"admin2","name":"roza","role":"editor","perms":{"add":true,"edit":true,"bulk":true},"cats":[],"active":true,"upd":1792611359457,"salt":"jb7hk7e5cs9m6720","hash":"67a064ec0e1edb0d02ed92fc6dc594745d870807e193df3db51407118e023c97"}]}</script>

function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,result='',words=[],abl=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};

ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((abl/mw)|0);words[words.length]=(abl);
for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0));
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}return result}
const H=s=>sha256(unescape(encodeURIComponent(s)));

const CATS=[{k:'uk',b:'УК',n:'Уголовный кодекс',c:'УК'},{k:'koap',b:'КоАП',n:'Кодекс об админ. правонарушениях',c:'КоАП'},{k:'upk',b:'УПК',n:'Уголовно-процессуальный кодекс',c:'УПК'},{k:'pk',b:'ПК',n:'Процессуальный кодекс',c:'ПК'},{k:'fz',b:'ФЗ',n:'ФЗ «О полиции»',c:'ФЗ'},{k:'term',b:'РП',n:'РП-термины',c:'Термины'}];

function cmpE(a,b){if(a._ci!==b._ci)return a._ci-b._ci;const x=a._nums,y=b._nums;if(x.length&&y.length){for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i],q=y[i];if(p===undefined)return -1;if(q===undefined)return 1;if(p!==q)return p-q}return 0}if(x.length)return -1;if(y.length)return 1;return a.title.localeCompare(b.title,'ru')}

function parseQ(raw){
 let s=norm(raw).replace(/(^|\s)ст(?:атья|атьи|\.)?\s*(?=\d)/g,'$1 ').replace(/(^|\s)(ук|упк|коап|фз|пк)(?=\d)/g,'$1$2 ');
 const parts=s.split(/[^а-яa-z0-9.\-]+/).map(x=>x.replace(/^[.\-]+|[.\-]+$/g,'')).filter(Boolean);
 const cats=new Set(),w=[],n=[];
 for(const p of parts){if(CATKEY[p]){cats.add(CATKEY[p]);continue}if(/^\d+([.\-]\d+)*$/.test(p)){n.push(p);continue}w.push(p)}
 return{cats,w,n}}
const stem=w=>w.length>4?w.slice(0,Math.max(4,w.length-2)):w;
function matchNum(e,n){let m=0;for(const x of e._nn){if(x===n)return 20;if(x.startsWith(n+'.')||x.startsWith(n+'-'))m=Math.max(m,12);else if(x.startsWith(n))m=Math.max(m,4)}return m}
function scoreE(e,q){let s=0,hit=0;
 for(const n of q.n){let m=matchNum(e,n);if(!m&&e._h.includes(n))m=1;if(m){s+=m;hit++}}
 for(const w of q.w){const st=stem(w);let m=0;
  if(e._tw.some(x=>x.startsWith(st)))m=6;else if(e._kw.some(x=>x.startsWith(st)))m=4;else if(w.length>3&&e._h.includes(st))m=1.5;
  if(m){s+=m;hit++}}
 return{s,hit}}
function runSearch(raw){
 const q=parseQ(raw),nt=q.w.length+q.n.length;let list;
 const pool=q.cats.size?DB.entries.filter(e=>q.cats.has(e.cat)):DB.entries;
 if(!nt){list=pool.slice().sort(cmpE)}
 else{const sc=pool.map(e=>[e,scoreE(e,q)]).filter(x=>x[1].hit>0);const mx=Math.max(0,...sc.map(x=>x[1].hit));
  list=sc.filter(x=>x[1].hit===mx).sort((a,b)=>b[1].s-a[1].s||cmpE(a[0],b[0])).map(x=>x[0])}
 return{q,list,hl:[...q.w.filter(x=>x.length>1).map(stem),...q.n]}}
const EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.`",RU='йцукенгшщзхъфывапролджэячсмитьбюё';
const fixLayout=s=>/\d/.test(s)||!/[a-z]/i.test(s)?s:s.toLowerCase().split('').map(c=>{const i=EN.indexOf(c);return i<0?c:RU[i]}).join('');
function search(raw){let r=runSearch(raw);r.fixed=null;
 if(!r.list.length&&raw.trim()){const f=fixLayout(raw);if(f!==raw.toLowerCase()){const r2=runSearch(f);if(r2.list.length){r2.fixed=f;r=r2}}}return r}
function hl(t,tk){if(!tk.length)return esc(t);const n=norm(t);const re=new RegExp(tk.map(escRe).join('|'),'g');let o='',l=0,m;while((m=re.exec(n))){if(!m[0])break;o+=esc(t.slice(l,m.index))+'<mark>'+esc(t.slice(m.index,m.index+m[0].length))+'</mark>';l=m.index+m[0].length}return o+esc(t.slice(l))}

  else for(const e of ok){const old=e.num?DB.entries.find(x=>x.cat===e.cat&&x.num===e.num):null;if(old)Object.assign(old,e,{id:old.id,upd:Date.now()});else DB.entries.push(Object.assign({id:rid(),upd:Date.now()},e))}

 ${sn.length?sn.map(s=>`<div class="log"><time>${fmtD(s.t)}</time><span style="flex:1">${esc(s.label)} · ${s.n} записей</span><span class="acts"><button data-act="a-restore" data-id="${s.id}">Восстановить</button><button data-act="a-snapdel" data-id="${s.id}">🗑</button></span></div>`).join(''):'<p>Копий пока нет</p>'}</div>
 <div class="sec"><h2>Опасная зона</h2><div class="btns" style="margin-top:0"><button class="btn dan" data-act="a-reset">Сбросить к данным файла</button></div><p>Отменяет все локальные правки и возвращает данные, вшитые в этот файл.</p></div>`;
 $('#if').onchange=e=>{const f=e.target.files[0];if(f&&need('data'))importJSON(f,$('#im').value)}}
function tLog(b){const lg=store.get('rmrp_log',[]),st=store.get('rmrp_stats',{q:{},miss:{}});const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,12);
 b.innerHTML=`<div class="sec"><h2>Запросы на этом устройстве</h2><div class="form"><div><h3 style="margin-top:0">Частые запросы</h3>${top(st.q).map(x=>`<div class="log"><span style="flex:1">${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<p>Нет данных</p>'}</div>
 <div><h3 style="margin-top:0">Без результата — добавьте синонимы</h3>${top(st.miss).map(x=>`<div class="log"><span style="flex:1">${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<p>Все запросы находили результат 👍</p>'}</div></div>
 <div class="btns"><button class="btn sm" data-act="a-clrstats">Очистить статистику</button></div></div>
 <div class="sec"><h2>Журнал изменений</h2>${lg.map(l=>`<div class="log"><time>${fmtD(l.t)}</time><span>${esc(l.a)}</span></div>`).join('')||'<p>Журнал пуст</p>'}<div class="btns"><button class="btn sm" data-act="a-clrlog">Очистить журнал</button></div></div>`}
function tUsers(b){
 b.innerHTML=`<div class="sec"><h2>Пользователи <span class="hint">· ${DB.users.length}</span></h2><p>Логин и пароль выдаёт главный админ. Права настраиваются по каждому человеку: что можно делать и в каких разделах.</p><div class="btns" style="margin:0 0 12px"><button class="btn pri" data-act="a-u-new">+ Новый пользователь</button></div>
 <div class="tw"><table class="tbl"><thead><tr><th>Логин</th><th>Имя</th><th>Роль</th><th class="hm">Права</th><th></th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><b>${esc(u.login)}</b>${u.active===false?' <span class="hint">(отключён)</span>':''}</td><td>${esc(u.name||'')}</td><td>${esc((ROLES[u.role]||ROLES.custom)[0])}</td><td class="hm" style="color:var(--m);font-size:12.5px">${u.role==='admin'?'всё':esc(PL.filter(p=>(u.perms||{})[p[0]]).map(p=>p[1]).join(', ')||'только просмотр')}${u.cats&&u.cats.length?'<br>Разделы: '+esc(u.cats.map(c=>CAT[c].c).join(', ')):''}</td><td><div class="acts"><button data-act="a-u-edit" data-id="${esc(u.login)}">✎</button><button data-act="a-u-del" data-id="${esc(u.login)}">🗑</button></div></td></tr>`).join('')}</tbody></table></div></div>
 <div class="sec"><h2>Важно</h2><p>Права действуют внутри этой страницы. Чтобы правки реально сохранялись в общую базу, у человека в меню «Поделиться» должен быть доступ «Соавтор» (или выше).</p></div>`}
function userEditor(login){const ex=login?DB.users.find(u=>u.login===login):null;const u=ex||{login:'',name:'',role:'editor',perms:{},cats:[],active:true};
 const pm=ex?(u.perms||{}):Object.fromEntries(ROLES.editor[1].map(k=>[k,true]));
 modal(`<div class="panel keep" style="max-width:640px"><button class="cl" data-act="closemodal">×</button><h2>${ex?'Пользователь «'+esc(u.login)+'»':'Новый пользователь'}</h2>
 <div class="form" style="margin-top:14px">
 <div class="f"><label>Логин (латиницей, цифры, _ . -)</label><input class="in" id="u_login" value="${esc(u.login)}" ${ex?'disabled':''} autocapitalize="off" spellcheck="false"></div>
 <div class="f"><label>Имя / позывной</label><input class="in" id="u_name" value="${esc(u.name||'')}"></div>
 <div class="f"><label>${ex?'Новый пароль (пусто — не менять)':'Пароль (от 6 символов)'}</label><input class="in" id="u_pw" autocomplete="off" spellcheck="false"></div>
 <div class="f"><label>Роль</label><select class="in" id="u_role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
 <div class="f w"><label>Что разрешено</label><div style="display:grid;gap:8px;margin-top:4px">${PL.map(p=>`<label style="font-size:14.5px;color:var(--t);font-weight:500;display:flex;gap:8px;align-items:center"><input type="checkbox" data-pm="${p[0]}" ${pm[p[0]]?'checked':''}> ${p[1]}</label>`).join('')}</div></div>
 <div class="f w"><label>Разделы, которые можно править (ничего не отмечено — все)</label><div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:4px">${CATS.map(c=>`<label style="font-size:14.5px;color:var(--t);font-weight:500;display:flex;gap:6px;align-items:center"><input type="checkbox" data-uc="${c.k}" ${(u.cats||[]).includes(c.k)?'checked':''}> ${c.c}</label>`).join('')}</div></div>
 <div class="f w"><label style="font-size:14.5px;color:var(--t);font-weight:500;display:flex;gap:8px;align-items:center"><input type="checkbox" id="u_act" ${u.active!==false?'checked':''}> Аккаунт активен</label></div></div>
 <div class="btns"><button class="btn pri" data-act="a-u-save" data-id="${ex?esc(u.login):''}">Сохранить</button><button class="btn" data-act="closemodal">Отмена</button></div></div>`);
 const syncR=()=>{const r=$('#u_role').value;document.querySelectorAll('[data-pm]').forEach(c=>{if(ROLES[r][1])c.checked=ROLES[r][1].includes(c.dataset.pm);c.disabled=r==='admin'})};
 $('#u_role').onchange=syncR;document.querySelectorAll('[data-pm]').forEach(c=>c.onchange=()=>{$('#u_role').value='custom'});syncR()}
function saveUser(old){const login=old||$('#u_login').value.trim();if(!/^[A-Za-z0-9_.-]{3,32}$/.test(login))return toast('Логин: 3–32 символа, латиница, цифры, _ . -');
 if(!old&&DB.users.some(u=>u.login.toLowerCase()===login.toLowerCase()))return toast('Такой логин уже есть');
 let r=$('#u_role').value;const perms={};document.querySelectorAll('[data-pm]').forEach(c=>{if(c.checked)perms[c.dataset.pm]=true});
 if(r==='admin')PL.forEach(p=>perms[p[0]]=true);else if(ROLES[r][1]&&(ROLES[r][1].length!==Object.keys(perms).length||!ROLES[r][1].every(k=>perms[k])))r='custom';
 const cats=[...document.querySelectorAll('[data-uc]')].filter(c=>c.checked).map(c=>c.dataset.uc),active=$('#u_act').checked,pw=$('#u_pw').value;
 if((!old||pw)&&pw.length<6)return toast('Пароль — от 6 символов');
 if(!DB.users.filter(u=>u.login!==login&&u.role==='admin'&&u.active!==false).length&&!(r==='admin'&&active))return toast('Должен остаться хотя бы один активный главный админ');
 if(ME().login===login&&!active)return toast('Нельзя отключить самого себя');
 const o=old?DB.users.find(u=>u.login===old):{login};Object.assign(o,{name:$('#u_name').value.trim(),role:r,perms,cats,active,upd:Date.now()});
 if(pw){o.salt=rid()+rid();o.hash=hashPw(o.salt,pw)}if(!old)DB.users.push(o);
 save();log((old?'Изменён':'Создан')+' пользователь '+login);closeModal();toast('Сохранено');renderAdmin()}
function tMe(b){const u=ME();b.innerHTML=`<div class="sec"><h2>Мой аккаунт</h2><p>Логин: <b>${esc(u.login)}</b> · роль: <b>${esc((ROLES[u.role]||ROLES.custom)[0])}</b></p><p>Права: ${u.role==='admin'?'все':esc(PL.filter(p=>(u.perms||{})[p[0]]).map(p=>p[1]).join(', ')||'только просмотр')}${u.cats&&u.cats.length?'. Разделы: '+esc(u.cats.map(c=>CAT[c].c).join(', ')):''}</p>
 <div class="form" style="margin-top:12px"><div class="f w"><label>Имя / позывной</label><input class="in" id="m_name" value="${esc(u.name||'')}"></div><div class="f"><label>Текущий пароль (нужен для смены)</label><input class="in" id="p0" type="password" autocomplete="current-password"></div><div class="f"></div><div class="f"><label>Новый пароль (от 6 символов)</label><input class="in" id="p1" type="password" autocomplete="new-password"></div><div class="f"><label>Повторите</label><input class="in" id="p2" type="password" autocomplete="new-password"></div></div>
 <div class="btns"><button class="btn pri" data-act="a-me-save">Сохранить</button></div></div>`}
function tSet(b){const s=DB.settings;
 b.innerHTML=`<div class="sec"><h2>Внешний вид и тексты</h2><div class="form">
 <div class="f"><label>Название сайта</label><input class="in" id="s_title" value="${esc(s.title)}"></div><div class="f"><label>Подзаголовок</label><input class="in" id="s_sub" value="${esc(s.sub)}"></div>
 <div class="f w"><label>Объявление для всех (оставьте пустым, чтобы скрыть)</label><input class="in" id="s_notice" value="${esc(s.notice)}" placeholder="Например: обновлён УК от 21.10"></div>
 <div class="f w"><label>Текст внизу страницы (источники). Можно HTML-ссылки.</label><textarea class="in" id="s_src">${esc(s.sources)}</textarea></div>
 <div class="f w"><label>Цветовая схема</label><div class="swatch">${Object.entries(ACC).map(([k,v])=>`<button data-act="a-acc" data-v="${k}" class="${s.accent===k?'on':''}" style="background:linear-gradient(135deg,${v[0]},${v[1]})" aria-label="${k}"></button>`).join('')}</div></div>
 <div class="f w"><label><input type="checkbox" id="s_btn" ${s.showAdminBtn?'checked':''}> Показывать кнопку админ-панели на сайте (если выключить — вход через адрес <code>…#admin</code> или ссылку «вход» внизу)</label></div></div>
 <div class="btns"><button class="btn pri" data-act="a-saveset">Сохранить настройки</button></div></div>`}

/* ===== общий обработчик ===== */
document.addEventListener('click',ev=>{
 const a=ev.target.closest('[data-act]');
 if(!a){const c=ev.target.closest('.card[data-id]');if(c&&!c.closest('#admin'))openSheet(c.dataset.id);return}
 ev.stopPropagation();const id=a.dataset.id,v=a.dataset.v;
 if(GATE[a.dataset.act]&&!need(GATE[a.dataset.act]))return;
 switch(a.dataset.act){
 case'fav':ev.preventDefault();fav.has(id)?fav.delete(id):fav.add(id);saveFav();if(a.dataset.sheet)openSheet(id);renderPub();break;
 case'cat':S.cat=v;S.limit=60;renderPub();break;
 case'more':S.limit+=60;renderPub();break;
 case'quick':closeSheet();qi.value=v;S.q=v;S.cat='all';S.limit=60;renderPub();window.scrollTo({top:0});qi.blur();break;
 case'sugpick':pickSug(id);break;
 case'sugall':sugEl.hidden=true;qi.blur();out.scrollIntoView({behavior:'smooth'});break;
 case'copy':{const e=DB.entries.find(x=>x.id===id);copyText(`${refOf(e)} — ${e.title}${punOf(e)?': '+punOf(e):''}`);break}
 case'closesheet':closeSheet();break;case'closemodal':closeModal();break;
 case'nclose':store.set('rmrp_nd_'+H(DB.settings.notice||''),1);applySettings();break;
 case'adminopen':openAdmin();break;
 case'login':doLogin();break;
 case'a-tab':A.tab=v;renderAdmin();window.scrollTo(0,0);break;
 case'a-exit':hideAdmin();break;
 case'a-seed':LAST=new Map();LASTSET='';queueSync();toast('Заливаю данные…');break;
 case'a-logout':sess.del('rmrp_auth');log('Выход из админ-панели');hideAdmin();break;
 case'a-new':editor(null);break;
 case'a-edit':{const e=DB.entries.find(x=>x.id===id);if(!e)break;if(!perm('edit',e.cat)){toast('Нет прав на редактирование этого раздела');break}closeSheet();editor(id);break}
 case'a-dup':{const e=DB.entries.find(x=>x.id===id);editor(null,Object.assign(strip(e),{num:'',title:e.title+' (копия)'}));break}
 case'a-save':saveEntry(id||null);break;
 case'a-del':{const e=DB.entries.find(x=>x.id===id);if(e&&!perm('del',e.cat)){toast('Нет прав на удаление');break}if(e&&confirm(`Удалить «${refOf(e)} — ${e.title}»?`))delEntries([id],`Удалена: ${refOf(e)} — ${e.title}`);break}
 case'a-sel':a.checked?A.sel.add(id):A.sel.delete(id);{const sb=$('#bdel');sb.hidden=!A.sel.size;sb.textContent='Удалить выбранные ('+A.sel.size+')'}ev.stopImmediatePropagation();return;
 case'a-bdel':if(confirm('Удалить выбранные записи: '+A.sel.size+'?\nПеред этим будет создана резервная копия.')){snap('Перед массовым удалением');delEntries([...A.sel],'Массовое удаление: '+A.sel.size+' записей')}break;
 case'a-pg':A.page+=+v;recRows();break;
 case'a-bparse':{A.bulk={cat:$('#bc').value,text:$('#bt').value,upd:$('#bu').checked};A.bulk.rows=parseBulk(A.bulk.cat,A.bulk.text);if(!A.bulk.rows.length)toast('Вставьте хотя бы одну строку');else bulkPrev();break}
 case'a-bgo':A.bulk.upd=$('#bu').checked;bulkGo();break;
 case'a-exporthtml':exportHTML();break;
 case'a-expjson':dl('zakonka_rmrp.json',JSON.stringify({rev:Date.now(),entries:strip(DB.entries),settings:pubSet()},null,1),'application/json');log('Экспорт JSON');break;
 case'a-expcsv':exportCSV();break;
 case'a-snap':snap('Ручная копия');log('Создана резервная копия');toast('Копия создана');renderTab();break;
 case'a-restore':{const s=store.get('rmrp_snaps',[]).find(x=>x.id===id);if(s&&confirm('Восстановить копию от '+fmtD(s.t)+'? Текущее состояние тоже сохранится в копиях.')){snap('Перед восстановлением копии');DB.entries=clone(s.data.entries);DB.settings=Object.assign({},DEFS,s.data.settings);delete DB.settings.passHash;DB.entries.forEach(idx);save();log('Восстановлена копия от '+fmtD(s.t));toast('Восстановлено');renderAdmin()}break}
 case'a-snapdel':store.set('rmrp_snaps',store.get('rmrp_snaps',[]).filter(x=>x.id!==id));renderTab();break;
 case'a-reset':if(confirm('Отменить ВСЕ локальные правки и вернуть данные из файла?')){snap('Перед сбросом');const keepU=DB.users;DB=clone(SEED);DB.users=keepU;DB.baseRev=SEED.rev;DB.dirty=false;DB.entries.forEach(idx);DB.settings=Object.assign({},DEFS,DB.settings);if(SH)save();else store.set('rmrp_db',DB);log('Сброс к данным файла');toast('Сброшено');renderAdmin()}break;
 case'a-clrlog':store.set('rmrp_log',[]);renderTab();break;
 case'a-clrstats':store.set('rmrp_stats',{q:{},miss:{}});renderTab();break;
 case'a-acc':DB.settings.accent=v;applySettings();save();tSet($('#admBody'));break;
 case'a-saveset':{const s=DB.settings;s.title=$('#s_title').value.trim()||DEFS.title;s.sub=$('#s_sub').value.trim();s.notice=$('#s_notice').value.trim();s.sources=$('#s_src').value;s.showAdminBtn=$('#s_btn').checked;save();log('Изменены настройки');applySettings();toast('Настройки сохранены');break}
 case'a-u-new':userEditor(null);break;
 case'a-u-edit':userEditor(id);break;
 case'a-u-save':saveUser(id||null);break;
 case'a-u-del':{const u=DB.users.find(x=>x.login===id);if(!u)break;if(ME().login===id){toast('Нельзя удалить самого себя');break}if(u.role==='admin'&&u.active!==false&&DB.users.filter(x=>x.role==='admin'&&x.active!==false).length<2){toast('Должен остаться хотя бы один главный админ');break}if(confirm('Удалить пользователя «'+id+'»?')){DB.users=DB.users.filter(x=>x.login!==id);save();log('Удалён пользователь '+id);renderTab()}break}
 case'a-me-save':{const u=ME(),n=$('#p1').value;u.name=$('#m_name').value.trim();if(n){if(hashPw(u.salt,$('#p0').value)!==u.hash)return toast('Текущий пароль неверный');if(n.length<6)return toast('Пароль короче 6 символов');if(n!==$('#p2').value)return toast('Пароли не совпадают');u.salt=rid()+rid();u.hash=hashPw(u.salt,n);WEAK=false;log('Пароль изменён')}u.upd=Date.now();save();toast('Сохранено');renderAdmin();break}
 }});
$('#btnAdmin').onclick=openAdmin;
$('#qx').onclick=()=>{qi.value='';S.q='';renderPub();qi.focus()};
$('#logo').addEventListener('click',(()=>{let n=0,t;return()=>{n++;clearTimeout(t);t=setTimeout(()=>n=0,900);if(n>=3){n=0;openAdmin()}}})());
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdmin()});

/* ===== старт ===== */
setTheme(store.get('rmrp_theme','dark'));
loadDB();applySettings();renderPub();
const shReady=(async()=>{try{if(!window.claude||!claude.use)return;DL=await claude.use('downloads');USR=await claude.use('user');const db=await claude.use('db');if(!db)return;SH=db;
 SH.collection('entries').onSnapshot(s=>{if(s.metadata.fromCache&&s.empty)return;REM.entries=new Map(s.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));applyRemote()},()=>{});
 SH.collection('users').onSnapshot(s=>{if(s.metadata.fromCache&&s.empty)return;REM.users=new Map(s.docs.map(d=>[d.id,d.data()]));applyRemote()},()=>{});
 SH.doc('meta/settings').onSnapshot(s=>{REM.settings=s.exists?s.data():null;applyRemote()},()=>{});
 SH.doc('meta/state').onSnapshot(s=>{haveState=s.exists;REM.rev=(s.data()||{}).rev||0;applyRemote();applySettings();if(!$('#admin').hidden&&A.tab==='dash'&&$('#modal').hidden)renderTab()},()=>{});
}catch(e){}})();
if(location.hash==='#admin')openAdmin();
window.__rmrp={H,search,get DB(){return DB}};
})();
